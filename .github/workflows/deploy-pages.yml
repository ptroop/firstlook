name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "index.html"
      - "styles.css"
      - "icon.svg"
      - "manifest.webmanifest"
      - "sw.js"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Prepare frontend-only artifact
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf _site
          mkdir -p _site
          for file in app.js index.html styles.css icon.svg manifest.webmanifest sw.js; do
            test -f "$file"
            cp -- "$file" _site/
          done
          test -f _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
