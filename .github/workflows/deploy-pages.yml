name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "application-kit.js"
      - "auth.js"
      - "hiring-signal.js"
      - "outreach-corpus.js"
      - "company-catalog.js"
      - "cv-evaluator.js"
      - "index.html"
      - "styles.css"
      - "icon.svg"
      - "manifest.webmanifest"
      - "sw.js"
      - "lib/pdfjs/pdf.min.mjs"
      - "lib/pdfjs/pdf.worker.min.mjs"
      - "browser-extension/README.md"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Prepare frontend-only artifact
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf _site
          mkdir -p _site
          for file in app.js application-kit.js auth.js hiring-signal.js outreach-corpus.js company-catalog.js cv-evaluator.js index.html styles.css icon.svg manifest.webmanifest sw.js; do
            test -f "$file"
            cp -- "$file" _site/
          done
          mkdir -p _site/lib/pdfjs
          cp -- lib/pdfjs/pdf.min.mjs lib/pdfjs/pdf.worker.min.mjs _site/lib/pdfjs/
          mkdir -p _site/browser-extension
          cp -- browser-extension/README.md _site/browser-extension/README.md
          test -f _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
